name: tests
on:
  push:
    paths: ["scraper/**", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parser and safeguard tests (offline, saved pages)
        run: python -m unittest discover -s tests -v
