name: daily-prices
on:
  schedule:
    - cron: "37 4 * * *"   # 06:37 Tallinn winter time / 07:37 summer time
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-prices
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape stores
        id: scrape
        continue-on-error: true
        run: python scraper/scrape.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Prices $(date -u +%F)"
          git push
      - name: Fail if a store failed (sends an email)
        if: steps.scrape.outcome == 'failure'
        run: exit 1
